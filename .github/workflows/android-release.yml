name: Android Release Artifacts

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build & Upload APK & AAB Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for gradlew
        run: chmod +x gradlew

      - name: Restore Keystore and Verify Credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.BASE64_KEYSTORE || secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Neither BASE64_KEYSTORE nor RELEASE_KEYSTORE_BASE64 secret is configured!"
            exit 1
          fi
          if [ -z "$RELEASE_STORE_PASSWORD" ]; then
            echo "ERROR: RELEASE_STORE_PASSWORD secret is missing!"
            exit 1
          fi
          if [ -z "$RELEASE_KEY_ALIAS" ]; then
            echo "ERROR: RELEASE_KEY_ALIAS secret is missing!"
            exit 1
          fi
          if [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "ERROR: RELEASE_KEY_PASSWORD secret is missing!"
            exit 1
          fi

          echo "Decoding keystore to app/release-key.jks..."
          echo "$KEYSTORE_BASE64" | base64 -d > app/release-key.jks

          if [ ! -s app/release-key.jks ]; then
            echo "ERROR: Decoded keystore file app/release-key.jks is missing or empty!"
            exit 1
          fi

          echo "Verifying keystore and key alias with keytool..."
          keytool -list -v -keystore app/release-key.jks -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" > keystore_info.txt

          if ! grep -q "Entry type: PrivateKeyEntry" keystore_info.txt && ! grep -q "Entry type: keyEntry" keystore_info.txt; then
            echo "ERROR: Alias '$RELEASE_KEY_ALIAS' in keystore is not a valid PrivateKeyEntry!"
            rm -f keystore_info.txt
            exit 1
          fi

          echo " Keystore verification successful."
          echo "Release Key Certificate Fingerprint (SHA-256):"
          grep "SHA256:" keystore_info.txt || grep "SHA-256:" keystore_info.txt || true
          rm -f keystore_info.txt

      - name: Build Signed Release APKs and AABs
        env:
          REQUIRE_RELEASE_SIGNING: "true"
          RELEASE_STORE_FILE: "release-key.jks"
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p build/outputs/artifacts/apk
          mkdir -p build/outputs/artifacts/aab

          ./gradlew :app:assemblePlayRelease :app:assembleFullSmsRelease :app:bundlePlayRelease :app:bundleFullSmsRelease

          PLAY_APK=$(find app/build/outputs/apk/play/release -name "*.apk" | head -n 1)
          FULLSMS_APK=$(find app/build/outputs/apk/fullSms/release -name "*.apk" | head -n 1)
          PLAY_AAB=$(find app/build/outputs/bundle/playRelease -name "*.aab" | head -n 1)
          FULLSMS_AAB=$(find app/build/outputs/bundle/fullSmsRelease -name "*.aab" | head -n 1)

          if [ -n "$PLAY_APK" ] && [ -n "$FULLSMS_APK" ] && [ -n "$PLAY_AAB" ] && [ -n "$FULLSMS_AAB" ]; then
            cp "$PLAY_APK" build/outputs/artifacts/apk/Rivava-Play.apk
            cp "$FULLSMS_APK" build/outputs/artifacts/apk/Rivava-FullSMS.apk
            cp "$PLAY_AAB" build/outputs/artifacts/aab/Rivava-Play.aab
            cp "$FULLSMS_AAB" build/outputs/artifacts/aab/Rivava-FullSMS.aab
          else
            echo "ERROR: Required Release build files (APK or AAB) were not found after Gradle build!"
            exit 1
          fi

      - name: Clean Up Keystore File
        if: always()
        run: rm -f app/release-key.jks

      - name: Verify Digital Signatures on Release AABs and APKs
        run: |
          echo "Verifying AAB digital signatures with jarsigner..."

          jarsigner -verify -verbose -certs build/outputs/artifacts/aab/Rivava-Play.aab > play_aab_verify.txt 2>&1
          PLAY_AAB_STATUS=$?
          if [ $PLAY_AAB_STATUS -ne 0 ] || ! grep -q "jar verified" play_aab_verify.txt; then
            echo "ERROR: Rivava-Play.aab digital signature verification failed (exit code $PLAY_AAB_STATUS)!"
            cat play_aab_verify.txt
            exit 1
          fi
          echo " Rivava-Play.aab digital signature verified."
          rm -f play_aab_verify.txt

          jarsigner -verify -verbose -certs build/outputs/artifacts/aab/Rivava-FullSMS.aab > fullsms_aab_verify.txt 2>&1
          FULLSMS_AAB_STATUS=$?
          if [ $FULLSMS_AAB_STATUS -ne 0 ] || ! grep -q "jar verified" fullsms_aab_verify.txt; then
            echo "ERROR: Rivava-FullSMS.aab digital signature verification failed (exit code $FULLSMS_AAB_STATUS)!"
            cat fullsms_aab_verify.txt
            exit 1
          fi
          echo " Rivava-FullSMS.aab digital signature verified."
          rm -f fullsms_aab_verify.txt

          echo "Verifying APK signatures with apksigner..."
          APKSIGNER_BIN=$(find $ANDROID_HOME/build-tools -name "apksigner" | tail -n 1)
          if [ -n "$APKSIGNER_BIN" ]; then
            "$APKSIGNER_BIN" verify --verbose --print-certs build/outputs/artifacts/apk/Rivava-Play.apk
            "$APKSIGNER_BIN" verify --verbose --print-certs build/outputs/artifacts/apk/Rivava-FullSMS.apk
          else
            jarsigner -verify -verbose -certs build/outputs/artifacts/apk/Rivava-Play.apk
            jarsigner -verify -verbose -certs build/outputs/artifacts/apk/Rivava-FullSMS.apk
          fi
          echo " APK digital signatures verified."

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rivava-APK
          path: build/outputs/artifacts/apk/
          retention-days: 30

      - name: Upload Play Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rivava-Play-AAB
          path: build/outputs/artifacts/aab/Rivava-Play.aab
          retention-days: 30

      - name: Upload All AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rivava-AAB
          path: build/outputs/artifacts/aab/
          retention-days: 30
