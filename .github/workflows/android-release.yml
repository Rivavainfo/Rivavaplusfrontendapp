
name: Android Release Artifacts

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build and Verify Signed Rivava APKs & AABs
    runs-on: ubuntu-latest

    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.BASE64_KEYSTORE }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RIVAVA_CI_SIGNING: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle Permission
        run: chmod +x gradlew

      - name: Validate Release Signing Secrets
        shell: bash
        run: |
          set -euo pipefail

          MISSING=0

          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing signing keystore secret: Neither RELEASE_KEYSTORE_BASE64 nor BASE64_KEYSTORE is set in GitHub Repository Secrets."
            echo "Please set RELEASE_KEYSTORE_BASE64 (or BASE64_KEYSTORE) in GitHub Settings -> Secrets and variables -> Actions."
            echo "To generate the Base64 string from your release-key.jks on Windows PowerShell, run:"
            echo '  [Convert]::ToBase64String([System.IO.File]::ReadAllBytes("path\to\release-key.jks")) | Set-Clipboard'
            MISSING=1
          fi

          if [ -z "${RELEASE_STORE_PASSWORD:-}" ]; then
            echo "::error::Missing signing secret: RELEASE_STORE_PASSWORD"
            echo "Please set RELEASE_STORE_PASSWORD in GitHub Settings -> Secrets and variables -> Actions."
            MISSING=1
          fi

          if [ -z "${RELEASE_KEY_ALIAS:-}" ]; then
            echo "::error::Missing signing secret: RELEASE_KEY_ALIAS"
            echo "Please set RELEASE_KEY_ALIAS in GitHub Settings -> Secrets and variables -> Actions."
            MISSING=1
          fi

          if [ -z "${RELEASE_KEY_PASSWORD:-}" ]; then
            echo "::error::Missing signing secret: RELEASE_KEY_PASSWORD"
            echo "Please set RELEASE_KEY_PASSWORD in GitHub Settings -> Secrets and variables -> Actions."
            MISSING=1
          fi

          if [ "$MISSING" -eq 1 ]; then
            exit 1
          fi

          echo "All release signing secrets are present."

      - name: Decode and Validate Signing Keystore
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode > app/release-key.jks

          chmod 600 app/release-key.jks

          if [ ! -s app/release-key.jks ]; then
            echo "::error::Decoded keystore file app/release-key.jks is empty or missing. Check Base64 secret format."
            exit 1
          fi

          KEYTOOL_OUT=$(keytool -list -v \
            -keystore app/release-key.jks \
            -storepass:env RELEASE_STORE_PASSWORD \
            -alias "$RELEASE_KEY_ALIAS" 2>&1) || {
              echo "::error::Failed to open keystore or locate alias '$RELEASE_KEY_ALIAS' with supplied store password."
              exit 1
            }

          if ! grep -qi "PrivateKeyEntry" <<< "$KEYTOOL_OUT"; then
            echo "::error::Key alias '$RELEASE_KEY_ALIAS' is not a PrivateKeyEntry in app/release-key.jks."
            exit 1
          fi

          echo "Release signing keystore validated."

      - name: Build Signed Release APKs and AABs
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assemblePlayRelease \
            :app:assembleFullSmsRelease \
            :app:bundlePlayRelease \
            :app:bundleFullSmsRelease \
            --no-daemon --stacktrace

      - name: Collect Release Artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/outputs/artifacts/apk
          mkdir -p build/outputs/artifacts/aab

          copy_artifact() {
            local source_dir="$1"
            local extension="$2"
            local destination="$3"
            local source_file

            source_file=$(find "$source_dir" \
              -type f -name "*.$extension" \
              -print -quit)

            if [ -z "$source_file" ]; then
              echo "::error::Artifact missing in $source_dir"
              exit 1
            fi

            cp "$source_file" "$destination"
            test -s "$destination"
          }

          copy_artifact \
            app/build/outputs/apk/play/release \
            apk \
            build/outputs/artifacts/apk/Rivava-Play.apk

          copy_artifact \
            app/build/outputs/apk/fullSms/release \
            apk \
            build/outputs/artifacts/apk/Rivava-FullSMS.apk

          copy_artifact \
            app/build/outputs/bundle/playRelease \
            aab \
            build/outputs/artifacts/aab/Rivava-Play.aab

          copy_artifact \
            app/build/outputs/bundle/fullSmsRelease \
            aab \
            build/outputs/artifacts/aab/Rivava-FullSMS.aab

          echo "All four release artifacts collected."

      - name: Verify APK and AAB Signatures
        shell: bash
        run: |
          set -euo pipefail

          normalize_fingerprint() {
            tr -d ':\r\n ' | tr '[:lower:]' '[:upper:]'
          }

          EXPECTED=$(
            keytool -list -v \
              -keystore app/release-key.jks \
              -storepass:env RELEASE_STORE_PASSWORD \
              -alias "$RELEASE_KEY_ALIAS" \
              | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
              | head -n 1 \
              | normalize_fingerprint
          )

          if [[ ! "$EXPECTED" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::Cannot read keystore fingerprint."
            exit 1
          fi

          echo "Expected signing SHA-256: $EXPECTED"

          for aab in build/outputs/artifacts/aab/*.aab; do
            echo "Verifying $aab"

            RESULT=$(jarsigner -verify -verbose "$aab" 2>&1) || {
              echo "$RESULT"
              exit 1
            }

            if ! grep -q 'jar verified.' <<< "$RESULT"; then
              echo "::error::AAB is not signed: $aab"
              exit 1
            fi

            ACTUAL=$(
              keytool -printcert -jarfile "$aab" \
                | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
                | head -n 1 \
                | normalize_fingerprint
            )

            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::AAB signing certificate mismatch."
              exit 1
            fi

            echo "AAB signature verified."
          done

          APKSIGNER=$(
            find "$ANDROID_HOME/build-tools" \
              -type f -name apksigner \
              | sort -V | tail -n 1
          )

          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner not found."
            exit 1
          fi

          for apk in build/outputs/artifacts/apk/*.apk; do
            echo "Verifying $apk"

            DETAILS=$("$APKSIGNER" verify \
              --verbose --print-certs "$apk")

            ACTUAL=$(
              printf '%s\n' "$DETAILS" \
                | sed -n \
                  's/^Signer #1 certificate SHA-256 digest:[[:space:]]*//p' \
                | head -n 1 \
                | normalize_fingerprint
            )

            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::APK signing certificate mismatch."
              exit 1
            fi

            echo "APK signature verified."
          done

          echo "All release artifacts are correctly signed."

      - name: Clean Up Keystore
        if: always()
        run: rm -f app/release-key.jks

      - name: Upload Signed APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rivava-Signed-APK
          path: build/outputs/artifacts/apk/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Signed AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rivava-Signed-AAB
          path: build/outputs/artifacts/aab/
          if-no-files-found: error
          retention-days: 30
