name: Android Release Artifacts

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build & Upload Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for gradlew
        run: chmod +x gradlew

      - name: Verify Secrets Presence
        env:
          BASE64_KEYSTORE: ${{ secrets.BASE64_KEYSTORE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "Checking required release signing secrets..."
          MISSING=0
          if [ -z "$BASE64_KEYSTORE" ]; then echo "Error: Secret BASE64_KEYSTORE is missing!"; MISSING=1; fi
          if [ -z "$RELEASE_STORE_PASSWORD" ]; then echo "Error: Secret RELEASE_STORE_PASSWORD is missing!"; MISSING=1; fi
          if [ -z "$RELEASE_KEY_ALIAS" ]; then echo "Error: Secret RELEASE_KEY_ALIAS is missing!"; MISSING=1; fi
          if [ -z "$RELEASE_KEY_PASSWORD" ]; then echo "Error: Secret RELEASE_KEY_PASSWORD is missing!"; MISSING=1; fi

          if [ $MISSING -ne 0 ]; then
            echo "Release build failed: Required signing secrets are missing. Unsigned builds are not allowed."
            exit 1
          fi
          echo "All required signing secrets are present."

      - name: Restore Keystore File
        env:
          BASE64_KEYSTORE: ${{ secrets.BASE64_KEYSTORE }}
        run: |
          mkdir -p app
          echo "$BASE64_KEYSTORE" | base64 -d > app/release-key.jks
          if [ ! -s app/release-key.jks ]; then
            echo "Error: Restored app/release-key.jks is empty or failed to decode!"
            exit 1
          fi
          echo "Keystore restored successfully. File size: $(stat -c%s app/release-key.jks) bytes."

      - name: Verify Keystore and Key Alias
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "Verifying keystore alias and entry type..."
          KEY_LIST=$(keytool -list -v -keystore app/release-key.jks -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" 2>&1)
          if [ $? -ne 0 ]; then
            echo "Error: Failed to inspect keystore with provided password and alias!"
            exit 1
          fi

          if echo "$KEY_LIST" | grep -q "Entry type: PrivateKeyEntry"; then
            echo "Alias '$RELEASE_KEY_ALIAS' verified as PrivateKeyEntry."
          else
            echo "Error: Key alias '$RELEASE_KEY_ALIAS' is not a PrivateKeyEntry!"
            exit 1
          fi

      - name: Build Release APKs and AABs
        env:
          RELEASE_STORE_FILE: "release-key.jks"
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p build/outputs/artifacts/apk
          mkdir -p build/outputs/artifacts/aab

          ./gradlew :app:assemblePlayRelease :app:assembleFullSmsRelease :app:bundlePlayRelease :app:bundleFullSmsRelease

          PLAY_APK=$(find app/build/outputs/apk/play/release -name "*.apk" | head -n 1)
          FULLSMS_APK=$(find app/build/outputs/apk/fullSms/release -name "*.apk" | head -n 1)
          PLAY_AAB=$(find app/build/outputs/bundle/playRelease -name "*.aab" | head -n 1)
          FULLSMS_AAB=$(find app/build/outputs/bundle/fullSmsRelease -name "*.aab" | head -n 1)

          if [ -n "$PLAY_APK" ] && [ -n "$FULLSMS_APK" ] && [ -n "$PLAY_AAB" ] && [ -n "$FULLSMS_AAB" ]; then
            cp "$PLAY_APK" build/outputs/artifacts/apk/Rivava-Play.apk
            cp "$FULLSMS_APK" build/outputs/artifacts/apk/Rivava-FullSMS.apk
            cp "$PLAY_AAB" build/outputs/artifacts/aab/Rivava-Play.aab
            cp "$FULLSMS_AAB" build/outputs/artifacts/aab/Rivava-FullSMS.aab
          else
            echo "Error: Release build outputs (APK or AAB) were not found!"
            exit 1
          fi

      - name: Verify Digital Signatures
        run: |
          echo "Verifying digital signatures on release artifacts..."

          echo "Verifying Play AAB signature..."
          jarsigner -verify build/outputs/artifacts/aab/Rivava-Play.aab
          if [ $? -ne 0 ]; then
            echo "Error: Rivava-Play.aab signature verification failed!"
            exit 1
          fi

          echo "Verifying FullSMS AAB signature..."
          jarsigner -verify build/outputs/artifacts/aab/Rivava-FullSMS.aab
          if [ $? -ne 0 ]; then
            echo "Error: Rivava-FullSMS.aab signature verification failed!"
            exit 1
          fi

          echo "Displaying signing certificate fingerprints for Google Play verification:"
          echo "--- Rivava-Play.aab Fingerprints ---"
          keytool -printcert -jarfile build/outputs/artifacts/aab/Rivava-Play.aab | grep -E "SHA1:|SHA256:" || true

      - name: Clean Up Keystore File
        if: always()
        run: rm -f app/release-key.jks

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rivava-APK
          path: build/outputs/artifacts/apk/
          retention-days: 30

      - name: Upload Play AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rivava-Play-AAB
          path: build/outputs/artifacts/aab/Rivava-Play.aab
          retention-days: 30

      - name: Upload FullSMS AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rivava-FullSMS-AAB
          path: build/outputs/artifacts/aab/Rivava-FullSMS.aab
          retention-days: 30
