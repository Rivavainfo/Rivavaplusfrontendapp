name: Android Release Artifacts

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build & Upload Signed Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore & Validate Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "=========================================================================================="
            echo "ERROR: Release signing credentials are missing or incomplete in GitHub Actions Secrets!"
            echo "Required GitHub Secrets:"
            echo "  - KEYSTORE_BASE64"
            echo "  - KEYSTORE_PASSWORD"
            echo "  - KEY_ALIAS"
            echo "  - KEY_PASSWORD"
            echo "=========================================================================================="
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > app/release-key.jks
          if [ ! -s "app/release-key.jks" ]; then
            echo "Error: Failed to decode KEYSTORE_BASE64 into app/release-key.jks or keystore file is empty!"
            exit 1
          fi
          echo "Release keystore decoded successfully."

      - name: Build Release APK and AAB Artifacts
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Organize and Prepare Release Output Files
        run: |
          mkdir -p build/outputs/artifacts

          # Find release APK and AAB outputs
          PRIMARY_APK=$(find app/build/outputs/apk -name "*release*.apk" | head -n 1)
          PRIMARY_AAB=$(find app/build/outputs/bundle -name "*release*.aab" | head -n 1)

          if [ -z "$PRIMARY_APK" ] || [ -z "$PRIMARY_AAB" ]; then
            echo "Error: Could not locate built release APK or AAB files in build outputs!"
            exit 1
          fi

          echo "Found primary APK: $PRIMARY_APK"
          echo "Found primary AAB: $PRIMARY_AAB"

          # Copy primary release artifacts to canonical named outputs
          cp "$PRIMARY_APK" build/outputs/artifacts/Rivava-release-signed.apk
          cp "$PRIMARY_AAB" build/outputs/artifacts/aab/Rivava-release-signed.aab 2>/dev/null || cp "$PRIMARY_AAB" build/outputs/artifacts/Rivava-release-signed.aab

          # Also preserve flavor-specific outputs if available
          PLAY_APK=$(find app/build/outputs/apk/play/release -name "*.apk" 2>/dev/null | head -n 1)
          FULLSMS_APK=$(find app/build/outputs/apk/fullSms/release -name "*.apk" 2>/dev/null | head -n 1)
          PLAY_AAB=$(find app/build/outputs/bundle/playRelease -name "*.aab" 2>/dev/null | head -n 1)
          FULLSMS_AAB=$(find app/build/outputs/bundle/fullSmsRelease -name "*.aab" 2>/dev/null | head -n 1)

          if [ -n "$PLAY_APK" ]; then cp "$PLAY_APK" build/outputs/artifacts/Rivava-Play-release-signed.apk; fi
          if [ -n "$FULLSMS_APK" ]; then cp "$FULLSMS_APK" build/outputs/artifacts/Rivava-FullSMS-release-signed.apk; fi
          if [ -n "$PLAY_AAB" ]; then cp "$PLAY_AAB" build/outputs/artifacts/Rivava-Play-release-signed.aab; fi
          if [ -n "$FULLSMS_AAB" ]; then cp "$FULLSMS_AAB" build/outputs/artifacts/Rivava-FullSMS-release-signed.aab; fi

      - name: Verify Signatures of Release Artifacts
        run: |
          echo "Verifying signature of Rivava-release-signed.apk..."
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name "apksigner" | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            $APKSIGNER verify --verbose build/outputs/artifacts/Rivava-release-signed.apk
          else
            jarsigner -verify -verbose -certs build/outputs/artifacts/Rivava-release-signed.apk
          fi

          echo "Verifying signature of Rivava-release-signed.aab..."
          jarsigner -verify build/outputs/artifacts/*Rivava-release-signed.aab || jarsigner -verify build/outputs/artifacts/aab/Rivava-release-signed.aab

          echo "Signature verification completed successfully."

      - name: Clean Up Keystore File
        if: always()
        run: |
          rm -f app/release-key.jks
          echo "Keystore file cleaned up."

      - name: Upload Signed Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rivava-Signed-Release-Artifacts
          path: build/outputs/artifacts/
          retention-days: 30
