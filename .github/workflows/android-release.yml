name: Android Release Artifacts

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build & Upload APK Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs (Signed Release or Debug Fallback)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p build/outputs/artifacts

          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "Release signing secrets detected. Decoding keystore and building signed Release APKs..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release-key.jks
            ./gradlew :app:assemblePlayRelease :app:assembleFullSmsRelease

            PLAY_APK=$(find app/build/outputs/apk/play/release -name "*.apk" | head -n 1)
            FULLSMS_APK=$(find app/build/outputs/apk/fullSms/release -name "*.apk" | head -n 1)

            if [ -n "$PLAY_APK" ] && [ -n "$FULLSMS_APK" ]; then
              cp "$PLAY_APK" build/outputs/artifacts/Rivava-Play.apk
              cp "$FULLSMS_APK" build/outputs/artifacts/Rivava-FullSMS.apk
            else
              echo "Error: Release APK files were not found after build!"
              exit 1
            fi
          else
            echo "=========================================================================================="
            echo "NOTICE: Release signing secrets are missing or incomplete."
            echo "Building Debug APKs instead for initial testing and distribution."
            echo ""
            echo "To enable signed release APKs in GitHub Actions:"
            echo "  1. Base64-encode your keystore: base64 -w 0 app/release-key.jks"
            echo "  2. Go to Repository Settings -> Secrets and variables -> Actions"
            echo "  3. Add the following repository secrets:"
            echo "     - RELEASE_KEYSTORE_BASE64"
            echo "     - RELEASE_STORE_PASSWORD"
            echo "     - RELEASE_KEY_ALIAS"
            echo "     - RELEASE_KEY_PASSWORD"
            echo "=========================================================================================="

            ./gradlew :app:assemblePlayDebug :app:assembleFullSmsDebug

            cp app/build/outputs/apk/play/debug/app-play-debug.apk build/outputs/artifacts/Rivava-Play.apk
            cp app/build/outputs/apk/fullSms/debug/app-fullSms-debug.apk build/outputs/artifacts/Rivava-FullSMS.apk
          fi

      - name: Verify APK Artifacts Exist
        run: |
          if [ ! -f "build/outputs/artifacts/Rivava-Play.apk" ] || [ ! -f "build/outputs/artifacts/Rivava-FullSMS.apk" ]; then
            echo "Error: One or both expected APK artifacts are missing from build output!"
            exit 1
          fi
          echo "Verification successful: Both Rivava-Play.apk and Rivava-FullSMS.apk generated."

      - name: Upload Play Flavor APK
        uses: actions/upload-artifact@v4
        with:
          name: Rivava-Play-APK
          path: build/outputs/artifacts/Rivava-Play.apk
          retention-days: 30

      - name: Upload FullSMS Flavor APK
        uses: actions/upload-artifact@v4
        with:
          name: Rivava-FullSMS-APK
          path: build/outputs/artifacts/Rivava-FullSMS.apk
          retention-days: 30
