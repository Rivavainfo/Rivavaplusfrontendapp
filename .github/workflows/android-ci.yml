name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare and verify release signing key
        shell: bash
        env:
          BASE64_KEYSTORE: ${{ secrets.BASE64_KEYSTORE }}
        run: |
          set -euo pipefail

          if [[ -z "${BASE64_KEYSTORE:-}" || -z "${RELEASE_STORE_PASSWORD:-}" || -z "${RELEASE_KEY_ALIAS:-}" || -z "${RELEASE_KEY_PASSWORD:-}" ]]; then
            echo "::error::Missing required signing secrets: BASE64_KEYSTORE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, or RELEASE_KEY_PASSWORD." >&2
            echo "::error::If credentials or passwords are lost or missing, signing is blocked until valid credentials are set or an upload key reset is requested in Google Play Console." >&2
            exit 1
          fi

          printf '%s' "$BASE64_KEYSTORE" | base64 --decode > app/release-key.jks
          echo "Checking decoded keystore..."
          test -s app/release-key.jks || exit 1
          sha256sum app/release-key.jks

          ACTUAL_SHA256="$(sha256sum app/release-key.jks | awk '{print $1}' | tr 'a-z' 'A-Z')"
          EXPECTED_SHA256="51E7512241263F1D5AF6E85641B5508FEBFE4C93306A7BA9D5D5F9701FA3EC00"
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::BASE64_KEYSTORE does not contain the expected new keystore." >&2
            exit 1
          fi
          echo "Correct keystore file confirmed."

          java .github/scripts/VerifyKeystore.java app/release-key.jks

      - name: Build release APKs and AABs
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: ./gradlew :app:assemblePlayRelease :app:assembleFullSmsRelease :app:bundlePlayRelease :app:bundleFullSmsRelease --stacktrace

      - name: Verify AAB and APK signatures and release artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar

          apks=(app/build/outputs/apk/**/*.apk)
          aabs=(app/build/outputs/bundle/**/*.aab)

          if (( ${#apks[@]} == 0 || ${#aabs[@]} == 0 )); then
            echo "::error::Expected release APKs and AABs were not produced." >&2
            find app/build/outputs -maxdepth 5 -type f | sort >&2 || true
            exit 1
          fi

          expected_sha1="B2:A7:7A:4B:B3:5F:93:7A:00:11:24:ED:3B:03:76:2F:17:F5:30:95"

          for artifact in "${aabs[@]}" "${apks[@]}"; do
            actual_sha1="$(keytool -printcert -jarfile "$artifact" \
              | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' | head -n 1 | tr 'a-z' 'A-Z')"
            if [[ -z "$actual_sha1" || "$actual_sha1" != "$expected_sha1" ]]; then
              echo "::error::Artifact is unsigned or signed with wrong key: $artifact (SHA-1: ${actual_sha1:-none}, expected: $expected_sha1)" >&2
              exit 1
            fi
            echo "Verified Google Play upload key signature on $artifact (SHA-1: $actual_sha1)"
          done

          printf 'Release APKs:\n - %s\n' "${apks[@]}"
          printf 'Release AABs:\n - %s\n' "${aabs[@]}"

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: rivava-release-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload release AABs
        uses: actions/upload-artifact@v4
        with:
          name: rivava-release-aabs
          path: app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
